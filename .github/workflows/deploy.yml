name: Deploy su GitHub Pages

# Compila l'app e pubblica la cartella dist/ sul branch gh-pages.
# In Settings › Pages scegliere: Source = "Deploy from a branch", Branch = gh-pages, cartella / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Voce AI HD "leggera" per telefoni: creata qui a partire dai modelli originali
      # (in cache tra una pubblicazione e l'altra, si rigenera solo se cambia lo script)
      - uses: actions/cache@v4
        id: lite-cache
        with:
          path: public/models/supertonic-lite
          key: supertonic-lite-${{ hashFiles('scripts/quantize_lite.py') }}
      - uses: actions/setup-python@v5
        if: steps.lite-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Crea la voce HD leggera
        if: steps.lite-cache.outputs.cache-hit != 'true'
        run: |
          pip install onnxruntime==1.32.0 onnx==1.23.2
          python scripts/quantize_lite.py public/models/supertonic-lite
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Pubblica su gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

    <path d="M256 282 C214 256 160 248 104 258 L104 392 C160 382 214 390 256 416 Z" fill="#0d1226" opacity="0.35" transform="translate(0 10)"/>
    <path d="M256 282 C214 256 160 248 104 258 L104 392 C160 382 214 390 256 416 Z" fill="url(#pageL)"/>
    <path d="M256 282 C298 256 352 248 408 258 L408 392 C352 382 298 390 256 416 Z" fill="url(#pageR)"/>
    <!-- righe di testo -->
    <g stroke="#c9b48f" stroke-width="7" stroke-linecap="round" opacity="0.7">
      <path d="M132 292 C166 286 196 288 226 300"/>
      <path d="M132 318 C166 312 196 314 226 326"/>
      <path d="M132 344 C166 338 196 340 226 352"/>
      <path d="M286 300 C316 288 346 286 380 292"/>

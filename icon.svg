    <path d="M256 282 L256 416" stroke="#b89d70" stroke-width="5"/>
    <path d="M104 392 C160 382 214 390 256 416 C298 390 352 382 408 392" fill="none" stroke="#f07a2a" stroke-width="10" stroke-linecap="round"/>

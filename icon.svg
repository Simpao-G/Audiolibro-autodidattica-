    <path d="M136 196 V208"/>
    <path d="M172 172 V232"/>
    <path d="M208 140 V244"/>
    <path d="M244 104 V250"/>
    <path d="M280 124 V250"/>
    <path d="M316 152 V244"/>
    <path d="M352 178 V230"/>
    <path d="M388 198 V210"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2e3d6e"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf3e4"/>
      <stop offset="1" stop-color="#e9dcc3"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fbf3e4"/>
      <stop offset="1" stop-color="#e2d2b4"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="100">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f07a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f2a33a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2a33a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="sfondo" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="200" fill="url(#glow)"/>

  <!-- Onda sonora (barre) che esce dalle pagine -->
